name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Test Suite (State Machine + Interaction E2E + Motion)
        run: npm test

      - name: Run Export Pipeline (Screens, Composite, PDF)
        run: npm run export

      - name: Upload Export Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: export-deliverables
          path: |
            export/
            test-results/
          retention-days: 14
